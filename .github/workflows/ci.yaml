name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc

      # `local_s3` is unreachable from a GitHub Actions runner. This step
      # requires a `dagshub_storage` remote already committed in
      # .dvc/config (see prior message for the one-time local setup
      # commands) — without it, `dvc repro` below fails on the pull.
      
      # - name: Configure DVC remote credentials
      #   env:
      #     DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      #   run: |
      #     dvc remote modify dagshub_storage --local access_key_id "$DAGSHUB_TOKEN"
      #     dvc remote modify dagshub_storage --local secret_access_key "$DAGSHUB_TOKEN"

      - name: run pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m unittest tests/test_model.py
 
      # Mirrors src/model/register_model.py's alias-based convention —
      # moves the "staging" alias to "production" rather than
      # registering a new version.
      - name: Promote model to production
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python scripts/promote_model.py
 
      # URLGuard's endpoint is FastAPI (app/main.py), not Flask — uses
      # FastAPI's TestClient against the real / and /predict routes.
      - name: Run FastAPI app tests
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m unittest tests/test_app.py


      
      - name: Login to AWS ECR
        if: success()
        run: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set region ${{ secrets.AWS_REGION }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # Requires a Dockerfile at the project root — not yet built.
      # It should COPY app/ + app/requirements.txt (the lightweight app
      # deps), not the heavy project-root requirements.txt used above
      # for the pipeline/test steps.
      - name: Build Docker image
        run: |
            docker build -t ${{ secrets.ECR_REPOSITORY }}:latest .

      - name: Tag Docker image
        run: |
            docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Check Docker Authentication
        run: docker info

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Set Up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Cluster name is a placeholder — replace with your actual EKS
      # cluster name once one exists; none has been created in this
      # project yet.
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name urlguard-cluster

      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic DAGSHUB_TOKEN-secret \
            --from-literal=DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }} --dry-run=client -o yaml | kubectl apply -f -

      # Requires deployment.yaml at the project root — not yet written.
      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yaml